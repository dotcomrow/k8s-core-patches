apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpa-recommendation-applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vpa-recommendation-applier
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpa-recommendation-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpa-recommendation-applier
subjects:
  - kind: ServiceAccount
    name: vpa-recommendation-applier
    namespace: goldilocks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-recommendation-applier
  namespace: goldilocks
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  apply.sh: |
    #!/bin/sh
    set -u

    log() {
      printf '%s\n' "$*"
    }

    inplace_support="unknown"

    missing=0
    if [ -z "${REPO_URL:-}" ]; then log "Missing env: REPO_URL"; missing=1; fi
    if [ -z "${REPO_BRANCH:-}" ]; then log "Missing env: REPO_BRANCH"; missing=1; fi
    if [ -z "${TARGET_DIR:-}" ]; then log "Missing env: TARGET_DIR"; missing=1; fi
    if [ -z "${GIT_USERNAME:-}" ]; then log "Missing env: GIT_USERNAME"; missing=1; fi
    if [ -z "${GIT_TOKEN:-}" ]; then log "Missing env: GIT_TOKEN"; missing=1; fi
    if [ "$missing" -eq 1 ]; then
      log "Missing required env; skipping run"
      exit 0
    fi

    if ! apk add --no-cache git ca-certificates jq >/dev/null; then
      log "apk add failed; skipping run"
      exit 0
    fi

    WORKDIR="$(mktemp -d)" || { log "mktemp failed"; exit 0; }
    trap 'rm -rf "$WORKDIR"' EXIT

    AUTH_URL="https://${GIT_USERNAME}:${GIT_TOKEN}@${REPO_URL#https://}"
    if ! git clone --branch "${REPO_BRANCH}" "${AUTH_URL}" "${WORKDIR}/repo" >/dev/null; then
      log "git clone failed; skipping run"
      exit 0
    fi

    if ! cd "${WORKDIR}/repo/${TARGET_DIR}" >/dev/null 2>&1; then
      log "target dir not found: ${TARGET_DIR}"
      exit 0
    fi

    for file in *.json; do
      [ -e "$file" ] || continue

      if ! jq -e . "$file" >/dev/null 2>&1; then
        log "Skipping $file (invalid json)"
        continue
      fi

      namespace=$(jq -r '.metadata.namespace // empty' "$file")
      kind=$(jq -r '.kind // empty' "$file")
      name=$(jq -r '.metadata.name // empty' "$file")

      if [ -z "$namespace" ] || [ -z "$kind" ] || [ -z "$name" ]; then
        log "Skipping $file (missing metadata)"
        continue
      fi

      if ! kubectl get "$kind" -n "$namespace" "$name" >/dev/null 2>&1; then
        log "Skipping $file ($kind/$namespace/$name not found)"
        continue
      fi

      live="$(kubectl get "$kind" -n "$namespace" "$name" -o json 2>/dev/null || true)"
      if [ -z "$live" ]; then
        log "Skipping $file ($kind/$namespace/$name read failed)"
        continue
      fi

      pod_selector="$(echo "$live" | jq -r '
        if .spec.selector == null then "" else
          (.spec.selector.matchLabels // {} | to_entries | map("\(.key)=\(.value)") | join(",")) as $labels
          | (.spec.selector.matchExpressions // [] | map(
              if .operator == "In" then "\(.key) in (\(.values|join(",")))"
              elif .operator == "NotIn" then "\(.key) notin (\(.values|join(",")))"
              elif .operator == "Exists" then "\(.key)"
              elif .operator == "DoesNotExist" then "!\(.key)"
              else empty end
            ) | join(",")) as $exprs
          | [$labels, $exprs] | map(select(length>0)) | join(",")
        end
      ')"
      pods_ready=0
      pods_json=""
      template_update_logged=0
      kind_lc=$(echo "$kind" | tr '[:upper:]' '[:lower:]')
      template_update_mode="skip-unsupported"
      update_strategy=""
      if [ "$kind_lc" = "statefulset" ] || [ "$kind_lc" = "daemonset" ]; then
        update_strategy="$(echo "$live" | jq -r '.spec.updateStrategy.type // "RollingUpdate"')"
        if [ "$update_strategy" = "OnDelete" ]; then
          template_update_mode="ondelete"
        else
          template_update_mode="skip-update-strategy"
        fi
      elif [ "$kind_lc" = "deployment" ]; then
        template_update_mode="skip-deployment"
      fi

      tmp_containers="$(mktemp)"
      if ! jq -c '.spec.template.spec.containers[]?' "$file" > "$tmp_containers" 2>/dev/null; then
        log "Skipping $file (containers parse failed)"
        rm -f "$tmp_containers"
        continue
      fi
      if [ ! -s "$tmp_containers" ]; then
        log "Skipping $file (no containers)"
        rm -f "$tmp_containers"
        continue
      fi

      restart_needed=0

      while IFS= read -r container; do
        cname=$(echo "$container" | jq -r '.name // empty')
        req_cpu=$(echo "$container" | jq -r '.resources.requests.cpu // empty')
        req_mem=$(echo "$container" | jq -r '.resources.requests.memory // empty')
        lim_cpu=$(echo "$container" | jq -r '.resources.limits.cpu // empty')
        lim_mem=$(echo "$container" | jq -r '.resources.limits.memory // empty')

        if [ -z "$cname" ]; then
          log "Skipping $file container (missing name)"
          continue
        fi

        if [ -z "$req_cpu" ] && [ -z "$req_mem" ] && [ -z "$lim_cpu" ] && [ -z "$lim_mem" ]; then
          log "Skipping $file container $cname (no resource values)"
          continue
        fi

        live_container=$(echo "$live" | jq -c --arg name "$cname" '.spec.template.spec.containers[]? | select(.name==$name)' 2>/dev/null || true)
        if [ -z "$live_container" ]; then
          log "Skipping $file container $cname (not found)"
          continue
        fi

        live_req_cpu=$(echo "$live_container" | jq -r '.resources.requests.cpu // empty')
        live_req_mem=$(echo "$live_container" | jq -r '.resources.requests.memory // empty')
        live_lim_cpu=$(echo "$live_container" | jq -r '.resources.limits.cpu // empty')
        live_lim_mem=$(echo "$live_container" | jq -r '.resources.limits.memory // empty')

        changed=0
        if [ -n "$req_cpu" ] && [ "$req_cpu" != "$live_req_cpu" ]; then changed=1; fi
        if [ -n "$req_mem" ] && [ "$req_mem" != "$live_req_mem" ]; then changed=1; fi
        if [ -n "$lim_cpu" ] && [ "$lim_cpu" != "$live_lim_cpu" ]; then changed=1; fi
        if [ -n "$lim_mem" ] && [ "$lim_mem" != "$live_lim_mem" ]; then changed=1; fi

        if [ "$changed" -eq 0 ]; then
          log "No change for $kind/$namespace/$name container $cname"
          continue
        fi

        pod_patch=$(jq -n --arg name "$cname" \
          --arg req_cpu "$req_cpu" --arg req_mem "$req_mem" \
          --arg lim_cpu "$lim_cpu" --arg lim_mem "$lim_mem" '
          {spec:{containers:[{name:$name,resources:{}}]}}
          | if $req_cpu != "" or $req_mem != "" then
              .spec.containers[0].resources.requests = {}
            else . end
          | if $req_cpu != "" then .spec.containers[0].resources.requests.cpu = $req_cpu else . end
          | if $req_mem != "" then .spec.containers[0].resources.requests.memory = $req_mem else . end
          | if $lim_cpu != "" or $lim_mem != "" then
              .spec.containers[0].resources.limits = {}
            else . end
          | if $lim_cpu != "" then .spec.containers[0].resources.limits.cpu = $lim_cpu else . end
          | if $lim_mem != "" then .spec.containers[0].resources.limits.memory = $lim_mem else . end
        ')

        template_patch=$(jq -n --arg name "$cname" \
          --arg req_cpu "$req_cpu" --arg req_mem "$req_mem" \
          --arg lim_cpu "$lim_cpu" --arg lim_mem "$lim_mem" '
          {spec:{template:{spec:{containers:[{name:$name,resources:{}}]}}}}
          | if $req_cpu != "" or $req_mem != "" then
              .spec.template.spec.containers[0].resources.requests = {}
            else . end
          | if $req_cpu != "" then .spec.template.spec.containers[0].resources.requests.cpu = $req_cpu else . end
          | if $req_mem != "" then .spec.template.spec.containers[0].resources.requests.memory = $req_mem else . end
          | if $lim_cpu != "" or $lim_mem != "" then
              .spec.template.spec.containers[0].resources.limits = {}
            else . end
          | if $lim_cpu != "" then .spec.template.spec.containers[0].resources.limits.cpu = $lim_cpu else . end
          | if $lim_mem != "" then .spec.template.spec.containers[0].resources.limits.memory = $lim_mem else . end
        ')

        if [ "$inplace_support" != "no" ]; then
          if [ "$pods_ready" -eq 0 ]; then
            if [ -n "$pod_selector" ]; then
              pods_json="$(kubectl get pods -n "$namespace" -l "$pod_selector" -o json 2>/dev/null || true)"
              if [ -n "$pods_json" ] && [ "$(echo "$pods_json" | jq '.items | length')" -gt 0 ]; then
                pods_ready=1
              else
                pods_ready=2
              fi
            else
              pods_ready=2
            fi
          fi

          if [ "$pods_ready" -eq 1 ]; then
            target_pods="$(echo "$pods_json" | jq -r --arg name "$cname" '.items[] | select(.spec.containers[]?.name==$name) | .metadata.name')"
          else
            target_pods=""
          fi

          if [ "$inplace_support" = "unknown" ] && [ "$pods_ready" -eq 1 ] && [ -n "$target_pods" ]; then
            test_pod="$(printf '%s\n' "$target_pods" | head -n 1)"
            if kubectl patch pod "$test_pod" -n "$namespace" --subresource=resize --type strategic --dry-run=server -p "$pod_patch" >/dev/null 2>&1; then
              inplace_support="yes"
              log "Detected in-place pod resize support"
            else
              inplace_support="no"
              log "In-place pod resize not supported; using rollout restarts"
            fi
          fi

          if [ "$inplace_support" = "yes" ] && [ "$pods_ready" -eq 1 ]; then
            if [ -z "$target_pods" ]; then
              log "No pods found for $kind/$namespace/$name container $cname"
              continue
            fi

            for pod in $target_pods; do
              if kubectl patch pod "$pod" -n "$namespace" --subresource=resize --type strategic -p "$pod_patch" >/dev/null 2>&1; then
                log "Resized pod $pod ($kind/$namespace/$name) container $cname"
              else
                log "Failed to resize pod $pod ($kind/$namespace/$name) container $cname (non-fatal)"
              fi
            done

            if [ "$template_update_mode" = "ondelete" ]; then
              if kubectl patch "$kind" -n "$namespace" "$name" --type strategic --field-manager=vpa-recommendation-applier -p "$template_patch" >/dev/null 2>&1; then
                log "Patched template $kind/$namespace/$name container $cname (OnDelete)"
              else
                log "Failed to patch template $kind/$namespace/$name container $cname (non-fatal)"
              fi
            else
              if [ "$template_update_logged" -eq 0 ]; then
                case "$template_update_mode" in
                  skip-deployment)
                    log "Skipping template update for Deployment $namespace/$name (always rolls out)"
                    ;;
                  skip-update-strategy)
                    log "Skipping template update for $kind/$namespace/$name (updateStrategy not OnDelete)"
                    ;;
                  *)
                    log "Skipping template update for $kind/$namespace/$name (unsupported kind)"
                    ;;
                esac
                template_update_logged=1
              fi
            fi
            continue
          fi
        fi

        if kubectl patch "$kind" -n "$namespace" "$name" --type strategic --field-manager=vpa-recommendation-applier -p "$template_patch" >/dev/null 2>&1; then
          log "Patched $kind/$namespace/$name container $cname"
          restart_needed=1
        else
          log "Failed to patch $kind/$namespace/$name container $cname (non-fatal)"
        fi
      done < "$tmp_containers"

      rm -f "$tmp_containers"

      if [ "$restart_needed" -eq 1 ]; then
        if kubectl rollout restart "$kind_lc/$name" -n "$namespace" >/dev/null 2>&1; then
          log "Restarted $kind/$namespace/$name"
        else
          log "Rollout restart failed for $kind/$namespace/$name (non-fatal)"
        fi
      fi
    done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vpa-recommendation-apply
  namespace: goldilocks
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: vpa-recommendation-applier
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: alpine/k8s:1.35.0
          command: ["/bin/sh", "-c"]
          args: ["/scripts/apply.sh"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: REPO_URL
              value: "https://github.com/dotcomrow/k8s-core-patches.git"
            - name: REPO_BRANCH
              value: "prod"
            - name: TARGET_DIR
              value: "vpa-recommendations"
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vpa-recommendation-exporter-git
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vpa-recommendation-exporter-git
                  key: token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vpa-recommendation-applier
            defaultMode: 0755
