apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpa-recommendation-applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vpa-recommendation-applier
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpa-recommendation-applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpa-recommendation-applier
subjects:
  - kind: ServiceAccount
    name: vpa-recommendation-applier
    namespace: goldilocks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-recommendation-applier
  namespace: goldilocks
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  apply.sh: |
    #!/bin/sh
    set -eu

    : "${REPO_URL:?}"
    : "${REPO_BRANCH:?}"
    : "${TARGET_DIR:?}"
    : "${GIT_USERNAME:?}"
    : "${GIT_TOKEN:?}"

    apk add --no-cache git ca-certificates jq >/dev/null

    WORKDIR="$(mktemp -d)"
    trap 'rm -rf "$WORKDIR"' EXIT

    AUTH_URL="https://${GIT_USERNAME}:${GIT_TOKEN}@${REPO_URL#https://}"
    git clone --branch "${REPO_BRANCH}" "${AUTH_URL}" "${WORKDIR}/repo" >/dev/null

    cd "${WORKDIR}/repo/${TARGET_DIR}"

    for file in *.json; do
      [ -e "$file" ] || continue

      namespace=$(jq -r '.metadata.namespace // empty' "$file")
      kind=$(jq -r '.kind // empty' "$file")
      name=$(jq -r '.metadata.name // empty' "$file")

      if [ -z "$namespace" ] || [ -z "$kind" ] || [ -z "$name" ]; then
        echo "Skipping $file (missing metadata)"
        continue
      fi

      if ! kubectl get "$kind" -n "$namespace" "$name" >/dev/null 2>&1; then
        echo "Skipping $file ($kind/$namespace/$name not found)"
        continue
      fi

      live="$(kubectl get "$kind" -n "$namespace" "$name" -o json)"

      jq -c '.spec.template.spec.containers[]?' "$file" | while read -r container; do
        cname=$(echo "$container" | jq -r '.name // empty')
        cpu=$(echo "$container" | jq -r '.resources.requests.cpu // empty')
        memory=$(echo "$container" | jq -r '.resources.requests.memory // empty')

        if [ -z "$cname" ] || [ -z "$cpu" ] || [ -z "$memory" ]; then
          echo "Skipping $file container (missing fields)"
          continue
        fi

        if echo "$live" | jq -e --arg name "$cname" '.spec.template.spec.containers[]? | select(.name==$name)' >/dev/null; then
          patch=$(jq -n --arg name "$cname" --arg cpu "$cpu" --arg memory "$memory" '{spec:{template:{spec:{containers:[{name:$name,resources:{requests:{cpu:$cpu,memory:$memory}}}]}}}}')
          if ! kubectl patch "$kind" -n "$namespace" "$name" --type strategic --field-manager=vpa-recommendation-applier -p "$patch"; then
            echo "Failed to patch $kind/$namespace/$name container $cname (requests: cpu=$cpu memory=$memory)"
          fi
        else
          echo "Skipping $file container $cname (not found)"
        fi
      done
    done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vpa-recommendation-apply
  namespace: goldilocks
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: vpa-recommendation-applier
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: alpine/k8s:1.31.4
          command: ["/bin/sh", "-c"]
          args: ["/scripts/apply.sh"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: REPO_URL
              value: "https://github.com/dotcomrow/k8s-core-patches.git"
            - name: REPO_BRANCH
              value: "prod"
            - name: TARGET_DIR
              value: "vpa-recommendations"
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vpa-recommendation-exporter-git
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vpa-recommendation-exporter-git
                  key: token
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vpa-recommendation-applier
            defaultMode: 0755
