apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-nginx-role
  namespace: ingress-nginx
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-nginx-binding
  namespace: ingress-nginx
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ingress-nginx
roleRef:
  kind: Role
  name: patch-nginx-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-nginx-deployment
  namespace: ingress-nginx
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: default
      automountServiceAccountToken: true
      containers:
        - name: patch
          image: lachlanevenson/k8s-kubectl:v1.23.0
          command:
            - /bin/sh
            - -c
            - |
              echo "🔧 Waiting for deployment to be ready..."
              kubectl wait --for=condition=available deployment/ingress-nginx-controller -n ingress-nginx --timeout=300s
              
              echo "🔧 Adding container resource limits..."
              kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
                --type=strategic \
                -p='{"spec":{"template":{"spec":{"containers":[{"name":"controller","resources":{"requests":{"cpu":"200m","memory":"768Mi"},"limits":{"cpu":"900m","memory":"2Gi"}}}]}}}}'
              
              echo "🔧 Patching Helm metadata..."
              kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
                --type=merge \
                -p='{"metadata": {"labels": {"app.kubernetes.io/managed-by": "Helm"}, "annotations": {"meta.helm.sh/release-name": "ingress-nginx-controller", "meta.helm.sh/release-namespace": "ingress-nginx"}}}'
              
              echo "✅ All patches applied successfully!"
              
              echo "🔍 Verifying patches..."
              kubectl get deployment ingress-nginx-controller -n ingress-nginx -o jsonpath='{.spec.template.spec.containers[0].resources}' || echo "Failed to get resources"
      restartPolicy: Never
