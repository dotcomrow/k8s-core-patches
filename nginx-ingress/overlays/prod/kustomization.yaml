resources:
  - ../../base
  - patch.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx
    path: patch-container-resources.yaml

# ArgoCD-specific configurations
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
